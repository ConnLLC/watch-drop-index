name: weekly refresh

# THE PAID HALF. The free stages moved to daily.yml on 2026-08-05; this job keeps
# the two that cost money — stage 2 (availability checks) and stage 4 (the
# new-release search) — plus the free ones, because a watch found by stage 4
# should get its photograph, its buy-link classification and its tier in the same
# run rather than waiting for tomorrow's sweep. Running them twice a day costs
# nothing and the daily job is idempotent.
#
# The cadence here is still uniform across 252 entries, and that is known to be
# wrong in both directions at once: a rank-0 buyable entry's order window can
# close in hours, while a Patek allocation piece has not been buyable since
# announcement and will not become so. A proposal tiered by volatility is owed
# once this job produces its first real cost number.
#
# Because Pages deploys from the main branch, the commit this job makes IS the
# deploy — there is no separate publish step. Note that a push authenticated with
# GITHUB_TOKEN deliberately does not trigger other workflows, so the `template`
# workflow will not run on this job's commit; the data validation step below
# covers that gap in-job. If Pages is ever switched to an Actions-based deploy,
# this token will stop triggering it and the site will silently stop updating —
# use a deploy key or a PAT at that point.

on:
  schedule:
    - cron: '0 9 * * MON'   # 09:00 UTC Monday. Named day on purpose — a numeric
                            # weekday is off-by-one on some cron implementations.
                            # Drifts an hour with BST; harmless for a refresh.
  workflow_dispatch:
    inputs:
      stages:
        description: 'Stages (2=availability, 10=search+verify buy links, 3=photos, 4=new releases, 6=calendar, 7=image rot, 8=buy links, 9=source+cal links)'
        default: '2,10,4,7,3,6,8,9'
        required: false
      dry_run:
        description: 'Run everything but write nothing'
        type: boolean
        default: false
      photo_batch:
        description: 'Cap the photograph pass (0 = every entry that still has none)'
        default: '0'
        required: false
      search_limit:
        description: 'Cap stage 10 to the N worst entries (blank = every one due a search)'
        default: ''
        required: false
      budget_cad:
        description: 'Override this run''s spend ceiling in CAD (blank = the WEEKLY_BUDGET_CAD variable)'
        default: ''
        required: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet anthropic requests

      - name: Decision-logic tests
        # These gate the run rather than merely reporting on it: if the rules
        # that decide when an entry may move are broken, we must not touch
        # data.json at all.
        run: python3 test/refresh_test.py

      - name: Run the refresh
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Repository VARIABLES, not secrets — Lowell needs to read the current
          # ceiling as well as change it, without a commit and without asking
          # either of us. Settings → Secrets and variables → Actions → Variables.
          # Unset falls back to the defaults in refresh.py (5 CAD, 1.40 CAD/USD).
          WEEKLY_BUDGET_CAD: ${{ vars.WEEKLY_BUDGET_CAD }}
          USD_TO_CAD: ${{ vars.USD_TO_CAD }}
        run: |
          set +e
          python3 scripts/refresh.py \
            --stages "${{ inputs.stages || '2,10,4,7,3,6,8,9' }}" \
            ${{ inputs.search_limit && format('--search-limit {0}', inputs.search_limit) || '' }} \
            --photo-batch "${{ inputs.photo_batch || '0' }}" \
            ${{ inputs.budget_cad && format('--budget {0}', inputs.budget_cad) || '' }} \
            ${{ inputs.dry_run == true && '--dry-run' || '' }}
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate the result before it can reach the site
        if: steps.refresh.outputs.code == '0'
        # Was an inline heredoc; extracted to test/validate_data.py when the
        # daily sweep arrived, so both jobs gate on the same rules. Two copies
        # of a validator drift, and the copy that drifts is the one that quietly
        # stops catching things.
        run: python3 test/validate_data.py

      - name: Commit and deploy
        if: steps.refresh.outputs.code == '0' && inputs.dry_run != true
        run: |
          if git diff --quiet -- data.json; then
            echo "data.json unchanged; nothing to commit."
            exit 0
          fi
          # Routine updates must never touch the template — that property is what
          # keeps this job cheap and its diffs reviewable.
          if ! git diff --quiet -- ':!data.json'; then
            echo "::error::the refresh modified something other than data.json"
            git diff --stat
            exit 1
          fi
          git config user.name  "watch-drop-index bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          # Built as a file rather than a heredoc: a heredoc nested inside a YAML
          # block scalar depends on indentation stripping to terminate, and
          # `head -c` can slice a multi-byte character in half.
          { cat refresh-subject.txt; echo; head -n 120 refresh-report.md; } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # The daily sweep may have pushed between this job's checkout and here.
          # The concurrency group stops them running at once, but it does not
          # stop one starting after the other finished. Both only ever rewrite
          # data.json, so rebasing is safe and losing a run to a race would be
          # silent — which is the failure worth avoiding.
          git pull --rebase --autostash
          git push

      - name: Job summary
        if: always()
        run: |
          if [ -f refresh-report.md ]; then cat refresh-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_exit code ${{ steps.refresh.outputs.code }}_" >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue instead of committing a mass sell-out
        if: steps.refresh.outputs.code == '20'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Refresh $(date -u +%Y-%m-%d) blocked: too many entries flipped to Gone" \
            --label "refresh" \
            --body-file refresh-report.md || true

      - name: Fail the run if the fetch layer went silent
        if: steps.refresh.outputs.code == '21'
        run: |
          echo "::error::Zero pages were readable across the availability checks."
          echo "That is a broken fetch layer, not a quiet week. data.json was not changed."
          exit 1

      - name: Fail on an unexpected exit
        if: steps.refresh.outputs.code != '0' && steps.refresh.outputs.code != '10' && steps.refresh.outputs.code != '20' && steps.refresh.outputs.code != '21'
        run: exit 1
