name: template

# Guards the contract between index.html and data.json. The masthead, availability
# badges and colophon are hydrated from the data at runtime, so a template change
# that drops those anchors would leave the live site quietly advertising stale
# figures. This catches that before it ships — which matters most when the design
# pass rewrites the markup.

on:
  push:
    branches: [main]
    paths: ['index.html', 'build.py', 'data.json', 'test/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['index.html', 'build.py', 'data.json', 'test/**']
  workflow_dispatch:

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: index.html must match what build.py produces
        # Compared with the hydrated figures normalised away. Those are rewritten
        # from data.json in the browser, so the committed template is *expected* to
        # carry stale numbers after a data-only refresh commit — that staleness is
        # the architecture working, not drift. Everything else must match exactly.
        run: |
          cp index.html /tmp/committed.html
          python3 build.py
          python3 - <<'PY'
          import re, sys

          def normalise(s):
              s = re.sub(r'(id="t-(?:buy|total|gone|brands|updated)"[^>]*>)[^<]*', r'\1#', s)
              s = re.sub(r'(id="c-(?:rev|imgs|total)"[^>]*>)[^<]*', r'\1#', s)
              s = re.sub(r'(<span class="n"[^>]*>)[^<]*', r'\1#', s)
              return s

          a = normalise(open('/tmp/committed.html').read())
          b = normalise(open('index.html').read())
          if a == b:
              print("index.html matches build.py output (ignoring hydrated figures).")
              sys.exit(0)
          print("::error::index.html is out of sync with build.py — run 'python3 build.py' and commit the result.")
          import difflib
          for line in list(difflib.unified_diff(a.splitlines(), b.splitlines(),
                                                'committed', 'rebuilt', lineterm=''))[:40]:
              print(line)
          sys.exit(1)
          PY

      - name: Template renders and hydrates correctly
        run: npm test
