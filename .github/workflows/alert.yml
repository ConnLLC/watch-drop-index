name: red-run alert

# A failed run used to notify no one. Twice that has meant a dead register that
# nothing announced: 21–27 Aug 2026 (a week, with two paid refreshes thrown away
# at the commit step) and 12–18 Sep 2026 (a week of sweeps refused at the test
# gate, found only because somebody happened to look).
#
# So: when any of the three workflows finishes red, open an issue assigned to
# the repository owner — GitHub emails an assignee — or, if that workflow's
# issue is already open, add the new run to it. When the same workflow next
# finishes green, close it. One issue per workflow, so a week of red mornings is
# one thread with seven comments rather than seven threads.
#
# No secrets and no outside service, on purpose: this project sits outside the
# estate, and an alert that depends on a key is an alert that can expire.
#
# `workflow_run` only fires from the copy of this file on the default branch.

on:
  workflow_run:
    workflows: ["daily sweep", "weekly refresh", "template"]
    types: [completed]

permissions:
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `cancelled` is left out: the shared concurrency group cancels nothing, so a
    # cancellation is a person pressing the button, and they already know.
    if: contains(fromJSON('["failure","timed_out","startup_failure","success"]'), github.event.workflow_run.conclusion)
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WF: ${{ github.event.workflow_run.name }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Open, extend or close the workflow's issue
        run: |
          set -euo pipefail
          title="RED: ${WF}"
          gh label create red-run --color B60205 \
            --description "A scheduled workflow is failing" --force >/dev/null
          # Matched on the exact title, not a search: search is fuzzy, and
          # "RED: daily sweep" must never close "RED: weekly refresh".
          open=$(gh issue list --state open --label red-run --limit 50 \
                   --json number,title \
                   --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [ "${CONCLUSION}" = "success" ]; then
            if [ -n "${open}" ]; then
              gh issue close "${open}" --comment "Green again: ${RUN_URL}"
            fi
            exit 0
          fi

          line="\`${WF}\` finished **${CONCLUSION}** (${RUN_EVENT}) — ${RUN_URL}"
          if [ -n "${open}" ]; then
            gh issue comment "${open}" --body "Still red. ${line}"
          else
            gh issue create --title "${title}" --label red-run --assignee "${OWNER}" \
              --body "${line}

          Nothing is published while this is open. The weekly refresh is the only workflow that can spend; if it is the red one, check whether the paid stages ran before it died.

          This issue closes itself the next time \`${WF}\` finishes green."
          fi
